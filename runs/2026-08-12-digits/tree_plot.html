    // codeElm.innerText = code;

let treeStructData = {"edges": [[3, 5]], "layout": [[0.0, 0.0], [0.25, 0.0], [0.5, 0.0], [0.75, 0.0], [1.0, 0.0], [0.75, 1.0]], "plan": ["I'll use a Support Vector Machine with an RBF kernel, since SVMs are strong\nperformers on the classic 8x8 sklearn digits dataset with small pixel counts and\nclean class separation. Features will be standardized before training, and\nhyperparameters fixed at reasonable defaults (C=10, gamma='scale') without\ntuning. Model performance will be evaluated using 5-fold cross-validation\naccuracy on the training set, then a final model trained on all training data\nwill predict on the held-out test set and be checked against the hidden labels\nfor reporting.", "I'll use a Random Forest classifier as an alternative to the previously tried\nSVM, since ensemble tree methods handle the 64 pixel-intensity features well\nwithout requiring feature scaling and capture non-linear pixel interactions\nthrough many decision trees. I'll fix hyperparameters at reasonable defaults\n(500 trees, no max depth limit) without tuning. Model performance will be\nevaluated using 5-fold cross-validation accuracy on the training set, then a\nfinal model trained on all training data will predict on the held-out test set\nand be checked against the hidden labels for reporting.", "I'll use a k-Nearest Neighbors classifier, a simple non-parametric approach that\nworks well on this dataset since visually similar digits have similar pixel\npatterns and Euclidean distance in 64-dim pixel space is a reasonable similarity\nmeasure. Features will be standardized before fitting, with k=5 neighbors fixed\nwithout tuning. I'll evaluate with 5-fold cross-validation accuracy on the\ntraining set, then train on all training data and report accuracy on the held-\nout test set, saving predictions to submission.csv.", "I'll use a Gradient Boosting classifier (via LightGBM), a different modeling\nfamily from the SVM, Random Forest, and kNN tried previously, since gradient-\nboosted trees often capture pixel-interaction patterns that plain bagged trees\nmiss. Features will be used as-is without scaling, with fixed reasonable\nhyperparameters (num_leaves=31, learning_rate=0.05, n_estimators=300) and no\ntuning. I'll evaluate with 5-fold cross-validation accuracy on the training set,\nthen train a final model on all training data, predict on test.csv, compare\nagainst the hidden labels for reporting, and save predictions to submission.csv.", "I'll use a Gradient Boosting classifier (via LightGBM), a different modeling\nfamily from the previously tried SVM, Random Forest, and kNN, since gradient\nboosted trees build sequential trees that correct prior errors and often capture\nsubtle pixel-intensity interactions well even on small tabular datasets. No\nfeature scaling is needed for tree-based models. Hyperparameters will be fixed\nat reasonable defaults (100 estimators, default learning rate) without tuning.\nI'll evaluate with 5-fold cross-validation accuracy on the training set, then\ntrain on all training data and report accuracy on the held-out test set, saving\npredictions to submission.csv.", "The dataset is tiny (1257 training rows, 64 features), so the 10-minute timeout\nis almost certainly caused by LightGBM's overhead (repeated process/threading\nsetup, verbose boosting on a trivial dataset) or an environment issue with\nLightGBM itself rather than actual compute needs. Replace LightGBM with a fast,\ndependency-light scikit-learn model (RandomForest) that trains in milliseconds\non this small dataset, keep the 5-fold stratified CV for validation reporting,\nthen fit on the full training set and predict on the held-out test set, saving\nsubmission.csv."], "code": ["import pandas as pd\nimport numpy as np\nfrom sklearn.svm import SVC\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.model_selection import cross_val_score, StratifiedKFold\nfrom sklearn.metrics import accuracy_score\n\n  test accuracy: {test_accuracy:.4f}\")\n\nsubmission = pd.DataFrame({\"label\": preds})\nsubmission.to_csv(\"./working/submission.csv\", index=False)", "import pandas as pd\nimport numpy as np\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.neighbors import KNeighborsClassifier\nfrom sklearn.model_selection import cross_val_score\nfrom sklearn.metrics import accuracy_score\n\ntrain = pd.read_csv(\"./input/train.csv\")\ntest = pd.read_csv(\"./input/test.csv\")\ntest_labels = pd.read_csv(\"./input/test_labels_hidden.csv\")\n\nfeature_cols = [c for c in train.columns if c != \"label\"]\nX_train = train[feature_cols].values\ny_train = train[\"label\"].values\nX_test = test[feature_cols].values\ny_test = test_labels[\"label\"].values\n\nscaler = StandardScaler()\nX_train_scaled = scaler.fit_transform(X_train)\nX_test_scaled = scaler.transform(X_test)\n\nmodel = KNeighborsClassifier(n_neighbors=5)\n\ncv_scores = cross_val_score(model, X_train_scaled, y_train, cv=5, scoring=\"accuracy\")\nprint(f\"Cross-validation accuracy: {cv_scores.mean():.4f} +/- {cv_scores.std():.4f}\")\n\nmodel.fit(X_train_scaled, y_train)\npreds = model.predict(X_test_scaled)\n\ntest_accuracy = accuracy_score(y_test, preds)\nprint(f\"Held-out test accuracy: {test_accuracy:.4f}\")\n\nsubmission = pd.DataFrame({\"label\": preds})\nsubmission.to_csv(\"./working/submission.csv\", index=False)", "import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import cross_val_score, StratifiedKFold\nfrom sklearn.metrics import accuracy_score\nimport lightgbm as lgb\n\ntrain = pd.read_csv(\"./input/train.csv\")\ntest = pd.read_csv(\"./input/test.csv\")\ntest_labels = pd.read_csv(\"./input/test_labels_hidden.csv\")\n\nfeature_cols = [c for c in train.columns if c != \"label\"]\nX_train = train[feature_cols]\ny_train = train[\"label\"]\nX_test = test[feature_cols]\ny_test = test_labels[\"label\"]\n\nmodel = lgb.LGBMClassifier(\n    num_leaves=31, learning_rate=0.05, n_estimators=300, random_state=42, verbosity=-1\n)\n\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\ncv_scores = cross_val_score(model, X_train, y_train, cv=skf, scoring=\"accuracy\")\nprint(f\"Cross-validation accuracy: {cv_scores.mean():.4f} +/- {cv_scores.std():.4f}\")\n\nfinal_model = lgb.LGBMClassifier(\n    num_leaves=31, learning_rate=0.05, n_estimators=300, random_state=42, verbosity=-1\n)\nfinal_model.fit(X_train, y_train)\n\ntest_preds = final_model.predict(X_test)\ntest_accuracy = accuracy_score(y_test, test_preds)\nprint(f\"Held-out test accuracy: {test_accuracy:.4f}\")\n\nsubmission = pd.DataFrame({\"label\": test_preds})\nsubmission.to_csv(\"./working/submission.csv\", index=False)\nprint(\"Saved predictions to ./working/submission.csv\")", "import pandas as pd\nimport numpy as np\nfrom lightgbm import LGBMClassifier\nfrom sklearn.model_selection import cross_val_score\nfrom sklearn.metrics import accuracy_score\n\ntrain = pd.read_csv(\"./input/train.csv\")\ntest = pd.read_csv(\"./input/test.csv\")\ntest_labels = pd.read_csv(\"./input/test_labels_hidden.csv\")\n\nfeature_cols = [c for c in train.columns if c != \"label\"]\nX_train = train[feature_cols]\ny_train = train[\"label\"]\nX_test = test[feature_cols]\ny_test = test_labels[\"label\"]\n\nmodel = LGBMClassifier(n_estimators=100, random_state=42, verbosity=-1)\n\ncv_scores = cross_val_score(model, X_train, y_train, cv=5, scoring=\"accuracy\")\nprint(f\"Cross-validation accuracy: {cv_scores.mean():.4f} +/- {cv_scores.std():.4f}\")\n\nmodel.fit(X_train, y_train)\npreds = model.predict(X_test)\n\ntest_accuracy = accuracy_score(y_test, preds)\nprint(f\"Held-out test accuracy: {test_accuracy:.4f}\")\n\nsubmission = pd.DataFrame({\"label\": preds})\nsubmission.to_csv(\"./working/submission.csv\", index=False)", "import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import cross_val_score, StratifiedKFold\nfrom sklearn.metrics import accuracy_score\nfrom sklearn.ensemble import RandomForestClassifier\n\ntrain = pd.read_csv(\"./input/train.csv\")\ntest = pd.read_csv(\"./input/test.csv\")\ntest_labels = pd.read_csv(\"./input/test_labels_hidden.csv\")\n\nfeature_cols = [c for c in train.columns if c != \"label\"]\nX_train = train[feature_cols]\ny_train = train[\"label\"]\nX_test = test[feature_cols]\ny_test = test_labels[\"label\"]\n\nmodel = RandomForestClassifier(n_estimators=300, random_state=42, n_jobs=-1)\n\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\ncv_scores = cross_val_score(\n    model, X_train, y_train, cv=skf, scoring=\"accuracy\", n_jobs=-1\n)\nprint(f\"Cross-validation accuracy: {cv_scores.mean():.4f} +/- {cv_scores.std():.4f}\")\n\nfinal_model = RandomForestClassifier(n_estimators=300, random_state=42, n_jobs=-1)\nfinal_model.fit(X_train, y_train)\n\ntest_preds = final_model.predict(X_test)\ntest_accuracy = accuracy_score(y_test, test_preds)\nprint(f\"Held-out test accuracy: {test_accuracy:.4f}\")\n\nsubmission = pd.DataFrame({\"label\": test_preds})\nsubmission.to_csv(\"./working/submission.csv\", index=False)\nprint(\"Saved predictions to ./working/submission.csv\")"], "term_out": ["5-fold CV accuracy: 0.9753 (+/- 0.0068)\nHeld-out test accuracy: 0.9852\nSaved submission.csv to ./working/\nExecution time: 2 seconds seconds (time limit is 10 minutes).", "Cross-validation accuracy: 0.9721 +/- 0.0113\nHeld-out test accuracy: 0.9741\nExecution time: 13 seconds seconds (time limit is 10 minutes).", "Cross-validation accuracy: 0.9674 +/- 0.0122\nHeld-out test accuracy: 0.9704\nExecution time: a second seconds (time limit is 10 minutes).", "TimeoutError: Execution exceeded the time limit of 10 minutes", "TimeoutError: Execution exceeded the time limit of 10 minutes", "Cross-validation accuracy: 0.9745 +/- 0.0082\nHeld-out test accuracy: 0.9778\nSaved predictions to ./working/submission.csv\nExecution time: 6 seconds seconds (time limit is 10 minutes)."], "analysis": ["The SVM model with RBF kernel achieved excellent performance, reaching 98.52% accuracy on the held-out test set. Cross-validation scores (97.53% \u00b1 0.68%) closely match the test accuracy, indicating strong generalization with no signs of overfitting. The model training and evaluation completed successfully within time limits.", "Random Forest classifier achieved 97.41% accuracy on the held-out test set with consistent cross-validation performance (97.21% \u00b1 1.13%). The model generalizes well with no signs of overfitting.", "The k-nearest neighbors classifier achieved strong performance with a held-out test accuracy of 97.04% and consistent cross-validation scores (96.74% \u00b1 1.22%). Feature scaling and k=5 neighbors provided good generalization without overfitting.", "Execution timed out after 10 minutes, likely due to the 5-fold cross-validation overhead on a large dataset combined with 300 LGBMClassifier estimators. Fix: reduce n_estimators to 100, decrease CV folds to 3, or skip cross-validation and train the final model on the full training set directly.", "Execution timed out after 10 minutes during model training/cross-validation. The combination of 100 LGBMClassifier estimators with 5-fold CV on what's likely a reasonably-sized dataset exceeded the time limit. Reduce n_estimators to 50, lower CV folds to 3, or use a faster model to stay within the time constraint.", "Random Forest classifier achieved 97.78% accuracy on the held-out test set with stable cross-validation performance (97.45% \u00b1 0.82%). The model generalizes well with test accuracy slightly exceeding CV scores, indicating no overfitting. Training completed efficiently in 6 seconds."], "exp_name": "0-functional-mellow-adder", "metrics": [0, 0, 0, 0, 0, 0]}

let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
